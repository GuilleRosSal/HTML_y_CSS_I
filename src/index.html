<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Portada</title>
    <meta name="description" content="Portada del sitio web" />

    <link rel="stylesheet" href="styles/styles.scss" />

    <script type="module" src="scripts/app.js"></script>

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <include src="fragments/header.html"></include>

    <main id="main-content" class="container">
      <h1>Blog de recetas caseras</h1>
      <p class="intro">
        Bienvenido a nuestro blog de recetas caseras. Aquí podrás encontrar deliciosos platos para preparar en casa.
      </p>

      <div class="collage-container">
        <picture>
          <source
            srcset="
              assets/images/chicken.jpg?as=avif&width=190 190w,
              assets/images/chicken.jpg?as=avif&width=300 300w,
              assets/images/chicken.jpg?as=avif&width=600 600w
            "
            sizes="(max-width: 767px) 190px, 300px"
            type="image/avif"
          />
          <source
            srcset="
              assets/images/chicken.jpg?as=webp&width=190 190w,
              assets/images/chicken.jpg?as=webp&width=300 300w,
              assets/images/chicken.jpg?as=webp&width=600 600w
            "
            sizes="(max-width: 767px) 190px, 300px"
            type="image/webp"
          />
          <img class="collage-img img1" src="assets/images/chicken.jpg?width=300" alt="Pollo asado con verduras" />
        </picture>

        <picture>
          <source
            srcset="
              assets/images/spaghetti.jpg?as=avif&width=210 210w,
              assets/images/spaghetti.jpg?as=avif&width=320 320w,
              assets/images/spaghetti.jpg?as=avif&width=640 640w
            "
            sizes="(max-width: 767px) 210px, 320px"
            type="image/avif"
          />
          <source
            srcset="
              assets/images/spaghetti.jpg?as=webp&width=210 210w,
              assets/images/spaghetti.jpg?as=webp&width=320 320w,
              assets/images/spaghetti.jpg?as=webp&width=640 640w
            "
            sizes="(max-width: 767px) 210px, 320px"
            type="image/webp"
          />
          <img class="collage-img img2" src="assets/images/spaghetti.jpg?width=320" alt="Espaguetis con ternera" />
        </picture>

        <picture>
          <source
            srcset="
              assets/images/taco.jpg?as=avif&width=190 190w,
              assets/images/taco.jpg?as=avif&width=290 290w,
              assets/images/taco.jpg?as=avif&width=580 580w
            "
            sizes="(max-width: 767px) 190px, 290px"
            type="image/avif"
          />
          <source
            srcset="
              assets/images/taco.jpg?as=webp&width=190 190w,
              assets/images/taco.jpg?as=webp&width=290 290w,
              assets/images/taco.jpg?as=webp&width=580 580w
            "
            sizes="(max-width: 767px) 190px, 290px"
            type="image/webp"
          />
          <img class="collage-img img3" src="assets/images/taco.jpg?width=290" alt="Tacos de carne y verduras" />
        </picture>

        <picture>
          <source
            srcset="
              assets/images/vegetables.jpg?as=avif&width=200 200w,
              assets/images/vegetables.jpg?as=avif&width=300 300w,
              assets/images/vegetables.jpg?as=avif&width=600 600w
            "
            sizes="(max-width: 767px) 200px, 300px"
            type="image/avif"
          />
          <source
            srcset="
              assets/images/vegetables.jpg?as=webp&width=200 200w,
              assets/images/vegetables.jpg?as=webp&width=300 300w,
              assets/images/vegetables.jpg?as=webp&width=600 600w
            "
            sizes="(max-width: 767px) 200px, 300px"
            type="image/webp"
          />
          <img
            class="collage-img img4"
            src="assets/images/vegetables.jpg?width=300"
            alt="Verduras asadas con hierbas"
          />
        </picture>
      </div>

      <section class="difficulty-category">
        <h2>Explora por dificultad</h2>
        <p>Explora nuestras recetas por nivel de dificultad: <a href="/categoria">Recetas por niveles</a></p>
      </section>
    </main>

    <include src="fragments/footer.html"></include>
  </body>
</html>
